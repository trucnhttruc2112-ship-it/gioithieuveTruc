<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Sưu Tập Hiệu Ứng Nút Bấm</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Hiệu Ứng Nút Bấm</h1>
        <p>Di chuột qua từng nút dưới đây để khám phá các hiệu ứng CSS đẹp mắt nhé!</p>
        
        <div class="buttons-grid">
            <!-- Nút 1: Hiệu ứng nổi lên và đổ bóng khi di chuột (Sử dụng transform translateY và box-shadow) -->
            <button class="btn btn-1">Bay Lên & Bóng Đổ</button>
            
            <!-- Nút 2: Hiệu ứng phóng to kích thước và làm đậm màu nền (Sử dụng transform scale) -->
            <button class="btn btn-2">Phóng To Nhẹ</button>
            
            <!-- Nút 3: Hiệu ứng một dải màu trượt từ trái sang lấp đầy nút (Sử dụng thẻ ::before trượt vị trí left) -->
            <button class="btn btn-3">Trượt Màu Nền</button>
            
            <!-- Nút 4: Hiệu ứng nền gradient tự động chuyển động liên tục và phát sáng viền khi hover (Sử dụng @keyframes) -->
            <button class="btn btn-4">Phát Sáng Động</button>
            
            <!-- Nút 5: Hiệu ứng thay đổi hình dạng các góc bo tròn (Sử dụng border-radius đảo chiều) -->
            <button class="btn btn-5">Đổi Hình Dạng</button>
            
            <!-- Nút 6: Hiệu ứng chữ phát sáng dạng đèn Neon (Sử dụng thay đổi color và text-shadow rực rỡ) -->
            <button class="btn btn-6">Đổi Màu Chữ</button>
            
            <!-- Nút 7: Hiệu ứng chuyển đổi màu nền mượt mà từ Tím sang Đỏ (Sử dụng background-color transition) -->
            <button class="btn btn-7">Đổi Màu Nền</button>
            

        </div>
    </div>

</body>
</html>
